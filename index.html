<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veyra · Evidence-led inventory</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#162429;background:#f3f5f3}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 16px;background:#123e3b;color:white;font-weight:650}button:hover{background:#19685f}button:disabled{opacity:.5}input,select{padding:10px 12px;border:1px solid #cbd6d1;border-radius:8px;background:white;color:#162429;min-width:0;width:100%}label{display:grid;gap:6px;font-size:12px;font-weight:700;color:#425852;text-transform:uppercase;letter-spacing:.04em}form{display:grid;gap:12px}.shell{display:grid;grid-template-columns:224px 1fr;min-height:100vh}aside{background:#102d2c;color:#d4e1db;padding:25px 16px;display:flex;flex-direction:column;gap:25px}aside strong{font-size:24px;letter-spacing:.12em;color:white}aside small{color:#91b7a8}nav{display:grid;gap:5px}nav button{background:transparent;text-align:left;width:100%;font-size:14px;color:#d4e1db;font-weight:500}nav button.active,nav button:hover{background:#22615a;color:white}main{max-width:1400px;width:100%;padding:32px clamp(16px,4vw,58px);margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px}h1{font-size:clamp(27px,3vw,40px);letter-spacing:-.04em;margin:4px 0}h2{font-size:19px;margin:0 0 16px}p{line-height:1.55}.muted{color:#63766e}section,.card{background:white;border:1px solid #e0e8e2;border-radius:14px;padding:22px;box-shadow:0 3px 18px #14352b08;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.metric{font-size:32px;font-weight:750;letter-spacing:-.04em;margin:8px 0}.eyebrow{font-size:12px;letter-spacing:.15em;color:#48796a;text-transform:uppercase;font-weight:750}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;text-transform:uppercase;letter-spacing:.07em;font-size:11px;color:#5e746b}td,th{padding:12px 10px;border-bottom:1px solid #edf1ec;white-space:nowrap}td{color:#293d36}tr:last-child td{border-bottom:0}.pill{display:inline-block;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:750;background:#e4f3ee;color:#12624f}.pill.bad{background:#fff0e9;color:#a34820}.pill.warn{background:#fff6dc;color:#8a630e}.result{border-left:5px solid #c98229;background:#fff8e8;padding:18px;margin:18px 0;border-radius:9px}.result.ok{background:#ebf7f1;border-color:#2d8a66}.result h2{margin:0 0 8px}.result dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.result dt{font-size:11px;color:#61756b;text-transform:uppercase}.result dd{font-weight:700;margin:4px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}.ghost{background:#e6f0e9;color:#175148}.ghost:hover{background:#d2e8d9}.auth{max-width:430px;margin:12vh auto;padding:30px}.banner{background:#e5f3ed;padding:16px;border-radius:10px;margin-bottom:18px;color:#285e4b}#notice{position:fixed;bottom:20px;right:20px;background:#153a36;color:white;padding:14px 20px;border-radius:10px;box-shadow:0 8px 30px #0004;max-width:350px;z-index:3}#notice[hidden]{display:none}.hint{font-size:13px;color:#647970}@media(max-width:800px){.shell{display:block}aside{padding:12px;gap:8px}aside strong{font-size:18px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;padding:9px}main{padding:18px}.two{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style></head><body><div id="app"></div><div id="notice" hidden role="alert"></div><script>
const state={token:sessionStorage.getItem('veyra_token'),user:sessionStorage.getItem('veyra_user'),page:'Dashboard',last:null,count:null};
const pages=['Dashboard','Inventory','Products','Warehouses','Receipts','Deliveries','Transfers','Physical Verification','Evidence Holds','Audit'];
const $=s=>document.querySelector(s), escapeHTML=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(m){const n=$('#notice');n.textContent=m;n.hidden=false;clearTimeout(window.noticeTimer);window.noticeTimer=setTimeout(()=>n.hidden=true,4500)}
async function api(path,data){let r=await fetch('/api/'+path,{method:data===undefined?'GET':'POST',headers:{'Content-Type':'application/json',...(state.token?{'Authorization':'Bearer '+state.token}:{})},...(data===undefined?{}:{body:JSON.stringify(data)})});let out=await r.json();if(!r.ok)throw Error(out.error||'Request failed');return out}
function field(label,name,type='text',value='',extra=''){return `<label>${escapeHTML(label)}<input name="${name}" type="${type}" value="${escapeHTML(value)}" ${extra} ${extra.includes('optional')?'':'required'}></label>`}
function form(id,fields,button){return `<form id="${id}">${fields}<button>${button}</button></form>`}
function panel(title,body){return `<section><h2>${title}</h2>${body}</section>`}
function table(items,keys){if(!items?.length)return '<p class="muted">No records yet.</p>';return `<div class="table-wrap"><table><thead><tr>${keys.map(k=>'<th>'+escapeHTML(k)+'</th>').join('')}</tr></thead><tbody>${items.map(row=>'<tr>'+keys.map(k=>'<td>'+escapeHTML(row[k])+'</td>').join('')).join('')}</tbody></table></div>`}
function decision(r){let good=r.status==='COMPLETED'||r.status==='ALLOWED';let heading=r.status==='COMPLETED'?'DELIVERY COMPLETED':good?'PHYSICAL EVIDENCE VERIFIED':'DELIVERY HELD';let msg=({'STALE_PHYSICAL_EVIDENCE':'Inventory changed after the physical verification. Recount this SKU at its source bin.','MISSING_PHYSICAL_EVIDENCE':'No physical verification exists for this SKU and bin.','CONFLICTING_PHYSICAL_EVIDENCE':'Counters disagree at the same inventory version. Resolve explicitly before delivery.','DISCREPANCY':'Physical count differs from recorded stock. Investigate and adjust explicitly.','INSUFFICIENT_STOCK':'Requested quantity exceeds recorded stock.'})[r.reason]||r.reason;return `<div class="result ${good?'ok':''}" role="status"><h2>${heading}</h2><p>${escapeHTML(msg)}</p><dl>${[['SKU',r.sku],['Bin',r.location],['Requested',r.requested],['Recorded',r.recorded],['Evidence version',r.evidence_version===null?'none':'v'+r.evidence_version],['Current version','v'+r.current_version],['Remaining',r.remaining]].filter(x=>x[1]!==undefined).map(([k,v])=>`<div><dt>${k}</dt><dd>${escapeHTML(v)}</dd></div>`).join('')}</dl>${r.required_action==='RECOUNT'?'<button type="button" id="recount">Start recount →</button>':''}${r.stage==='PREFLIGHT'?'<button type="button" id="release">Attempt delivery (server rechecks) →</button>':''}</div>`}
function authView(){return `<section class="auth"><div class="eyebrow">Inventory with proof</div><h1>Veyra</h1><p class="muted">Sign in to your local inventory workspace.</p>${form('auth',field('Username','username')+field('Password','password','password'),'Sign in')}<p class="hint">New workspace? <button type="button" class="ghost" id="signup">Create account</button></p></section>`}
async function render(page=state.page){state.page=page;if(!state.token){$('#app').innerHTML=authView();return}$('#app').innerHTML=`<div class="shell"><aside><div><strong>VEYRA</strong><br><small>Evidence-led inventory</small></div><nav>${pages.map(p=>`<button type="button" data-page="${p}" class="${p===page?'active':''}">${p}</button>`).join('')}</nav><button type="button" class="ghost" id="logout">Log out · ${escapeHTML(state.user)}</button></aside><main><header><div><div class="eyebrow">Operations / ${escapeHTML(page)}</div><h1>${escapeHTML(page)}</h1></div><span class="pill">LOCAL · LIVE DATABASE</span></header><div id="content"><p>Loading…</p></div></main></div>`;let c=$('#content');try{let html='';
if(page==='Dashboard'){let d=await api('dashboard');html='<div class="banner">A delivery can have sufficient recorded stock and still be held when its physical count is stale. Start in Deliveries or seed the demo.</div><div class="grid">'+Object.entries(d).map(([k,v])=>`<div class="card"><span class="eyebrow">${escapeHTML(k.replaceAll('_',' '))}</span><div class="metric">${escapeHTML(v)}</div></div>`).join('')+'</div>'+panel('Low stock / reorder',table((await api('inventory')).filter(r=>r.qty<=r.reorder_point),['sku','location','warehouse','qty','reorder_point']))}
if(page==='Inventory'){let q=new URLSearchParams(location.search);let list=await api('inventory'+(q.size?'?'+q:''));html=panel('Stock by location',`<input id="filter" placeholder="Search by SKU" aria-label="Search by SKU"><div id="stock-table">${table(list,['sku','name','warehouse','location','category','qty','version','reorder_point'])}</div>`);window.stockList=list}
if(page==='Products')html='<div class="two">'+panel('New product',form('product',field('SKU','sku')+field('Name','name')+field('Unit of measure','uom','text','unit')+field('Category (optional)','category','text','','data-optional="true"')+field('Reorder point','reorder_point','number',0,'min="0"'),'Create product'))+panel('New category',form('category',field('Name','name'),'Create category'))+'</div>'+panel('Update product',form('product-update',field('Existing SKU','sku')+field('New name','name'),'Update name'))+panel('Catalog',table(await api('products'),['sku','name','category','uom','reorder_point']));
if(page==='Warehouses')html='<div class="two">'+panel('New warehouse',form('warehouse',field('Code','code')+field('Name','name'),'Create warehouse'))+panel('New bin / location',form('location',field('Warehouse code','warehouse')+field('Bin code','code')+field('Name','name'),'Create location'))+'</div>'+panel('Warehouses',table(await api('warehouses'),['code','name']))+panel('Locations',table(await api('locations'),['warehouse','code','name']));
if(page==='Receipts')html=panel('Receive stock',form('receipt',field('Unique reference','ref')+field('Supplier','contact')+field('SKU','sku')+field('Location (WH/A)','location')+field('Quantity','qty','number',1,'min="1"'),'Validate receipt'))+panel('Recent receipts',table((await api('movements')).filter(m=>m.kind==='RECEIVE'),['ref','sku','destination','qty','contact','created_at']));
if(page==='Transfers')html=panel('Transfer stock between bins or warehouses',form('transfer',field('Unique reference','ref')+field('SKU','sku')+field('From (WH/A)','location')+field('To (OTHER/B)','destination')+field('Quantity','qty','number',1,'min="1"'),'Validate transfer'))+panel('Adjust recorded stock explicitly',form('adjust',field('Unique reference','ref')+field('SKU','sku')+field('Location','location')+field('New recorded quantity','qty','number',0,'min="0"'),'Validate adjustment'));
if(page==='Deliveries')html=panel('Delivery decision',`<p class="muted">Preflight is advisory. Release rechecks the count, stock and version inside the database transaction.</p>${form('delivery',field('Unique order reference','ref', 'text',state.last?.ref||'')+field('SKU','sku','text',state.last?.sku||'')+field('Source location (WH/A)','location','text',state.last?.location||'')+field('Quantity','qty','number',state.last?.qty||9,'min="1"')+field('Customer (optional)','contact','text',state.last?.contact||'','data-optional="true"'), 'Check delivery') }<div id="decision"></div>`)+panel('Orders',table(await api('deliveries'),['ref','sku','location','qty','state','contact']));
if(page==='Physical Verification')html=panel('Begin physical count',`<p class="muted">Start captures the current inventory version. Do not start a new session after the count; movements during a count make the submitted evidence stale.</p>${form('count-start',field('SKU','sku','text',state.last?.sku||'')+field('Location (WH/A)','location','text',state.last?.location||''),'Start count')}<div id="count-form">${state.count?countForm():''}</div>`)+panel('Evidence history',table(await api('evidence'),['id','sku','location','observed_qty','captured_version','status','actor_name','submitted_at']));
if(page==='Evidence Holds')html=panel('Delivery decisions',table(await api('decisions'),['ref','sku','location','stage','status','reason','evidence_version','current_version','stock_qty','created_at']));
if(page==='Audit')html=panel('Movement ledger',table(await api('movements'),['ref','kind','sku','source','destination','qty','source_version','dest_version','actor_name','created_at']))+panel('Count evidence',table(await api('evidence'),['sku','location','observed_qty','captured_version','status','submitted_at']));
c.innerHTML=html}catch(e){c.innerHTML='<p class="result">'+escapeHTML(e.message)+'</p>'}}
function countForm(){return `<div class="result"><strong>Count started · v${escapeHTML(state.count.captured_version)}</strong><p>Recorded ${escapeHTML(state.count.recorded_qty)} at ${escapeHTML(state.count.location)}. Enter the observed physical quantity below.</p>${form('count-submit',field('Observed quantity','qty','number','','min="0"'),'Submit physical evidence')}</div>`}
function data(form){return Object.fromEntries(new FormData(form).entries())}
async function action(e){let form=e.target.closest('form');if(form){e.preventDefault();let d=data(form);try{let id=form.id,r;if(id==='auth'){r=await api('login',d);state.token=r.token;state.user=r.username;sessionStorage.setItem('veyra_token',r.token);sessionStorage.setItem('veyra_user',r.username);return render()}if(id==='delivery'){d.qty=Number(d.qty);state.last=d;r=await api('deliveries/preflight',d);$('#decision').innerHTML=decision(r);return}if(id==='count-start'){state.count=await api('counts/start',d);$('#count-form').innerHTML=countForm();return}if(id==='count-submit'){r=await api('counts/submit',{session_id:state.count.session_id,qty:Number(d.qty)});state.count=null;notice('Evidence: '+r.status+' at v'+r.evidence_version);return render()}let routes={product:'products',category:'categories',warehouse:'warehouses',location:'locations','product-update':'products/update',receipt:'movements',transfer:'movements',adjust:'movements'};if(['receipt','transfer','adjust'].includes(id)){d.qty=Number(d.qty);d.kind={receipt:'RECEIVE',transfer:'TRANSFER',adjust:'ADJUST'}[id]}if(id==='product')d.reorder_point=Number(d.reorder_point);if(id==='product'&&!d.category)delete d.category;r=await api(routes[id],d);notice(r.status+' · '+(r.ref||id));render()}catch(err){notice(err.message)}return}
let b=e.target.closest('button');if(!b)return;if(b.dataset.page){render(b.dataset.page);return}if(b.id==='signup'){let d=data($('#auth'));try{let r=await api('signup',d);state.token=r.token;state.user=r.username;sessionStorage.setItem('veyra_token',r.token);sessionStorage.setItem('veyra_user',r.username);render()}catch(err){notice(err.message)}}if(b.id==='logout'){try{await api('logout',{})}catch{}sessionStorage.clear();state.token=null;render()}if(b.id==='recount')render('Physical Verification');if(b.id==='release'){try{let r=await api('deliveries/commit',state.last);$('#decision').innerHTML=decision(r);if(r.status==='COMPLETED')notice('Delivery completed · remaining '+r.remaining)}catch(err){notice(err.message)}}}
document.addEventListener('submit',action);document.addEventListener('click',action);document.addEventListener('input',e=>{if(e.target.id==='filter')$('#stock-table').innerHTML=table(window.stockList.filter(r=>r.sku.toLowerCase().includes(e.target.value.toLowerCase())),['sku','name','warehouse','location','category','qty','version','reorder_point'])});render();
</script></body></html>
