<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veyra · Evidence-led inventory</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#162429;background:#f3f5f3}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 16px;background:#123e3b;color:white;font-weight:650}button:hover{background:#19685f}button:disabled{opacity:.5}input,select,textarea{padding:10px 12px;border:1px solid #cbd6d1;border-radius:8px;background:white;color:#162429;min-width:0;width:100%}label{display:grid;gap:6px;font-size:12px;font-weight:700;color:#425852;text-transform:uppercase;letter-spacing:.04em}form{display:grid;gap:12px}.shell{display:grid;grid-template-columns:224px 1fr;min-height:100vh}aside{background:#102d2c;color:#d4e1db;padding:25px 16px;display:flex;flex-direction:column;gap:25px}aside strong{font-size:24px;letter-spacing:.12em;color:white}aside small{color:#91b7a8}nav{display:grid;gap:5px}nav button{background:transparent;text-align:left;width:100%;font-size:14px;color:#d4e1db;font-weight:500}nav button.active,nav button:hover{background:#22615a;color:white}main{max-width:1400px;width:100%;padding:32px clamp(16px,4vw,58px);margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px}h1{font-size:clamp(27px,3vw,40px);letter-spacing:-.04em;margin:4px 0}h2{font-size:19px;margin:0 0 16px}p{line-height:1.55}.muted{color:#63766e}section,.card{background:white;border:1px solid #e0e8e2;border-radius:14px;padding:22px;box-shadow:0 3px 18px #14352b08;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.metric{font-size:32px;font-weight:750;letter-spacing:-.04em;margin:8px 0}.eyebrow{font-size:12px;letter-spacing:.15em;color:#48796a;text-transform:uppercase;font-weight:750}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;text-transform:uppercase;letter-spacing:.07em;font-size:11px;color:#5e746b}td,th{padding:12px 10px;border-bottom:1px solid #edf1ec;white-space:nowrap}td{color:#293d36}tr:last-child td{border-bottom:0}.pill{display:inline-block;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:750;background:#e4f3ee;color:#12624f}.pill.bad{background:#fff0e9;color:#a34820}.pill.warn{background:#fff6dc;color:#8a630e}.blocked-line{background:#fff0e9}.line-table td{white-space:normal}.line-table th{white-space:normal}.editor-line{display:grid;grid-template-columns:1fr 1fr 115px auto;gap:10px;align-items:end;margin:12px 0}.editor-line .line-feedback{grid-column:1/-1;font-size:13px;color:#a34820}.editor-line .line-feedback.ok{color:#12624f}@media(max-width:800px){.editor-line{grid-template-columns:1fr 1fr}.editor-line .line-feedback{grid-column:1/-1}}.progress{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0}.progress span{padding:8px;border-radius:6px;background:#e9eeec;font-size:12px;font-weight:700}.progress span.current{background:#123e3b;color:white}.progress span.past{background:#d8f1e6;color:#14604f}.result{border-left:5px solid #c98229;background:#fff8e8;padding:18px;margin:18px 0;border-radius:9px}.result.ok{background:#ebf7f1;border-color:#2d8a66}.result h2{margin:0 0 8px}.result dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.result dt{font-size:11px;color:#61756b;text-transform:uppercase}.result dd{font-weight:700;margin:4px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}.ghost{background:#e6f0e9;color:#175148}.ghost:hover{background:#d2e8d9}.auth{max-width:430px;margin:12vh auto;padding:30px}.banner{background:#e5f3ed;padding:16px;border-radius:10px;margin-bottom:18px;color:#285e4b}#notice{position:fixed;bottom:20px;right:20px;background:#153a36;color:white;padding:14px 20px;border-radius:10px;box-shadow:0 8px 30px #0004;max-width:350px;z-index:3}#notice[hidden]{display:none}.hint{font-size:13px;color:#647970}.link{background:none;color:#126254;padding:4px 0;text-decoration:underline;text-underline-offset:3px}.link:hover{background:none;color:#093d34}.timeline{border-left:2px solid #c9dfd4;padding-left:18px;margin:18px 0}.timeline article{position:relative;padding:4px 0 18px}.timeline article:before{content:'';position:absolute;left:-24px;top:10px;width:10px;height:10px;border-radius:50%;background:#18715b}.investigate{font-size:15px}.investigate .metric{font-size:27px}.investigate .card{margin:0}.investigate .grid{margin-bottom:18px}.investigate .result{margin:12px 0}.investigate .pill{white-space:normal}button:focus-visible,input:focus-visible{outline:3px solid #e6a84a;outline-offset:2px}@media(max-width:800px){.shell{display:block}aside{padding:12px;gap:8px}aside strong{font-size:18px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;padding:9px}main{padding:18px}.two{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
.editor-line{grid-template-columns:minmax(150px,1fr) minmax(150px,1fr) minmax(105px,130px) auto;border:1px solid #e0e8e2;border-radius:10px;padding:12px;background:#fafcfb}.editor-line .line-feedback{border-top:1px solid #e0e8e2;padding-top:9px}.editor-line .line-feedback:not(.ok){font-weight:700}.line-table td{vertical-align:top}.line-table .pill{line-height:1.3}.table-wrap{max-width:100%}#content:focus{outline:none}@media(max-width:600px){section,.card{padding:16px}.editor-line{grid-template-columns:1fr}.editor-line .line-feedback{grid-column:1}.editor-line button{justify-self:start}#notice{left:12px;right:12px;bottom:12px;max-width:none}th,td{padding:9px 8px}}
</style></head><body><div id="app"></div><div id="notice" hidden role="alert"></div><script>
const state={token:sessionStorage.getItem('veyra_token'),user:sessionStorage.getItem('veyra_user'),page:'Dashboard',selectedRef:null,last:null,count:null,caseId:null,caseScope:null};
const pages=['Dashboard','Inventory','Products','Warehouses','Receipts','Deliveries','Transfers','Physical Verification','Evidence Holds','Investigation','Audit'];
const $=s=>document.querySelector(s), escapeHTML=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(m){const n=$('#notice');n.textContent=m;n.hidden=false;clearTimeout(window.noticeTimer);window.noticeTimer=setTimeout(()=>n.hidden=true,6500)}
const errors={UNAUTHORIZED:'Session expired. Sign in again.',FORBIDDEN:'This count session belongs to another operator.',INVALID_QTY:'Enter a valid whole-unit quantity.',QUANTITY_EXCEEDS_REMAINING:'Quantity exceeds the remaining picked or packed amount.',INSUFFICIENT_STOCK:'Not enough recorded stock at the source location.',INVALID_STATE_TRANSITION:'This delivery has moved to another step. Reload and check its status.',PICKING_INCOMPLETE:'Pick every line in full before completing picking.',PACKING_INCOMPLETE:'Pack every line in full before completing packing.',DUPLICATE_REFERENCE:'That reference is already in use or conflicts with this delivery.',DUPLICATE_DELIVERY_LINE:'Each product and source location can appear only once.',STALE_EVIDENCE:'Evidence changed. Open Investigation and recount at the current version.',INVALID_DELIVERY_LINE:'This line does not belong to the selected delivery.',MALFORMED_INPUT:'Request format was not accepted. Check quantities and try again.',CONSTRAINT_VIOLATION:'This change conflicts with an existing record. Check references and reload.'};
function errorMessage(code){return errors[code]||code.replaceAll('_',' ').toLowerCase().replace(/^./,c=>c.toUpperCase())+'. Check the entered values or reload.'}
async function api(path,data){let r=await fetch('/api/'+path,{method:data===undefined?'GET':'POST',headers:{'Content-Type':'application/json',...(state.token?{'Authorization':'Bearer '+state.token}:{})},...(data===undefined?{}:{body:JSON.stringify(data)})});let out=await r.json();if(!r.ok){if(r.status===401&&path!=='login'&&path!=='signup'){state.token=null;sessionStorage.removeItem('veyra_token');sessionStorage.removeItem('veyra_user');$('#app').innerHTML=authView()}throw Error(errorMessage(out.error||'REQUEST_FAILED'))}return out}
function field(label,name,type='text',value='',extra=''){return `<label>${escapeHTML(label)}<input name="${name}" type="${type}" value="${escapeHTML(value)}" ${extra} ${extra.includes('optional')?'':'required'}></label>`}
function form(id,fields,button){return `<form id="${id}">${fields}<button>${button}</button></form>`}
function panel(title,body){return `<section><h2>${title}</h2>${body}</section>`}
function table(items,keys){if(!items?.length)return '<p class="muted">No records yet.</p>';return `<div class="table-wrap"><table><thead><tr>${keys.map(k=>'<th>'+escapeHTML(k)+'</th>').join('')}</tr></thead><tbody>${items.map(row=>'<tr>'+keys.map(k=>'<td>'+escapeHTML(row[k])+'</td>').join('')).join('')}</tbody></table></div>`}
function stockTable(items){if(!items.length)return '<p class="muted">No inventory yet. Create a product and location, then receive stock.</p>';return `<div class="table-wrap"><table><thead><tr><th>SKU</th><th>Product</th><th>Location</th><th>On hand</th><th>Version</th><th>Reorder point</th><th>Integrity</th></tr></thead><tbody>${items.map(r=>`<tr><td>${escapeHTML(r.sku)}</td><td>${escapeHTML(r.name)}</td><td>${escapeHTML(r.warehouse+'/'+r.location)}</td><td>${escapeHTML(r.qty)}</td><td>v${escapeHTML(r.version)}</td><td>${escapeHTML(r.reorder_point)}</td><td><button type="button" class="link" data-sku="${escapeHTML(r.sku)}" data-location="${escapeHTML(r.warehouse+'/'+r.location)}">Investigate →</button></td></tr>`).join('')}</tbody></table></div>`}
function evidenceTable(items){if(!items.length)return '<p class="muted">No submitted counts yet. Start a physical verification.</p>';return `<div class="table-wrap"><table><thead><tr><th>ID</th><th>SKU</th><th>Location</th><th>Observed</th><th>Version</th><th>At submission</th><th>Investigation</th></tr></thead><tbody>${items.map(r=>`<tr><td>${escapeHTML(r.id)}</td><td>${escapeHTML(r.sku)}</td><td>${escapeHTML(r.location)}</td><td>${escapeHTML(r.observed_qty)}</td><td>v${escapeHTML(r.captured_version)}</td><td>${escapeHTML(r.status)}</td><td><button type="button" class="link" data-evidence="${escapeHTML(r.id)}">Investigate count →</button></td></tr>`).join('')}</tbody></table></div>`}
function investigationView(r){let e=r.evidence;return `<div class="investigate"><div class="banner"><strong>${escapeHTML(r.sku)} · ${escapeHTML(r.name)} / ${escapeHTML(r.location)}</strong><br>Evidence-led view for this product and bin. Recorded events are not proof of a physical cause.</div>${e?`<div class="grid">${[['Expected at count',e.expected],['Observed',e.observed],['Variance',(e.variance>0?'+':'')+e.variance],['Current on hand',r.current.qty],['Count version','v'+e.captured_version],['Current version','v'+r.current.version]].map(([k,v])=>`<div class="card"><span class="eyebrow">${k}</span><div class="metric">${escapeHTML(v)}</div></div>`).join('')}</div>`:`<div class="card">Current on hand: <strong>${escapeHTML(r.current.qty)}</strong> · v${escapeHTML(r.current.version)}</div>`}${panel('What the evidence supports',`<p>Count ${e?'#'+escapeHTML(e.id)+' · submitted '+escapeHTML(e.submitted_at)+' · '+escapeHTML(e.status_at_submission):'not yet recorded'}</p>${r.signals.map(s=>`<div class="result ${s.type==='AGREES'?'ok':''}"><strong>${escapeHTML(s.type.replaceAll('_',' '))}</strong><p>${escapeHTML(s.text)}</p></div>`).join('')}`)}${panel('Trace · scoped to this location',`<p class="muted">${r.last_verified?`Last earlier verified count #${escapeHTML(r.last_verified.id)}: ${escapeHTML(r.last_verified.observed_qty)} at v${escapeHTML(r.last_verified.captured_version)} · ${escapeHTML(r.last_verified.submitted_at)}`:'No earlier verified count; movement window begins at this count version.'}</p>${r.events.length?`<div class="timeline">${[...r.events].reverse().map(m=>`<article><strong>${escapeHTML(m.kind)} · ${escapeHTML(m.ref)}</strong> · ${escapeHTML(m.qty)} units ${m.delivery_ref?`<button type="button" class="link" data-order="${escapeHTML(m.delivery_ref)}">Open delivery →</button>`:''}<br><small>${escapeHTML(m.source||'outside')} → ${escapeHTML(m.destination||'outside')} · ${escapeHTML(m.created_at)} · ${escapeHTML(m.actor_name)} · ${escapeHTML(m.source_version===null?'': 'source v'+m.source_version)} ${escapeHTML(m.dest_version===null?'': 'destination v'+m.dest_version)}</small></article>`).join('')}</div>`:'<p class="muted">No recorded movement in the relevant version window.</p>'}${r.event_total>r.events.length?`<p class="result">Showing latest ${r.events.length} of ${r.event_total} events. Review Audit for older entries.</p>`:''}`)}${panel('Resolve and audit',`${r.resolution?`<div class="result ok">Adjusted via ${escapeHTML(r.resolution.movement_ref)} by ${escapeHTML(r.resolution.actor_name)} at ${escapeHTML(r.resolution.created_at)}. Note: ${escapeHTML(r.resolution.note)}. Recount required before delivery.</div>`:''}${e&&!r.resolution&&e.status_at_submission==='DISCREPANCY'&&e.captured_version===r.current.version?`<p>After checking the bin and records, explicitly set recorded stock to the observed count. This logs an adjustment, invalidates old evidence and requires a fresh count. Do not use this if the observation is wrong.</p>${form('resolve',field('Unique adjustment reference','ref')+field('Investigation note (what was checked)','note'),'Adjust to observed · recount required')}`:`<p class="muted">${e?'This count cannot currently be adjusted from here. Recount or review the existing resolution.':'Start a physical count to establish evidence.'}</p>`}<button type="button" class="ghost" id="investigate-recount">Start a fresh count →</button>`)} </div>`}
const reasons={VERIFIED:'Current count agrees with recorded stock.',STALE_PHYSICAL_EVIDENCE:'Inventory changed after the count. Recount this product at the source location.',MISSING_PHYSICAL_EVIDENCE:'No current physical count is available. Count this product at the source location.',CONFLICTING_PHYSICAL_EVIDENCE:'Counts at this version disagree. Investigate and adjust explicitly before recounting.',DISCREPANCY:'Count differs from recorded stock. Investigate and resolve explicitly.',INSUFFICIENT_STOCK:'Requested quantity exceeds recorded stock. Receive stock before retrying.'};
function decision(r){if(r.lines)return `<div class="result ${r.status==='BLOCKED'?'':'ok'}" role="status"><h2>${r.status==='BLOCKED'?'DELIVERY BLOCKED':r.status==='COMPLETED'?'DELIVERY COMPLETED':'PREFLIGHT ALLOWED'}</h2><p>${r.status==='BLOCKED'?'No stock deducted. Resolve every blocked line, then retry.':'All lines evaluated together.'}</p>${r.lines.map(l=>`<p><strong>${escapeHTML(l.sku)} · ${escapeHTML(l.location)}</strong> — ${escapeHTML(reasons[l.reason]||l.reason)} · Evidence ${escapeHTML(l.evidence_version===null?'none':'v'+l.evidence_version)} / current v${escapeHTML(l.current_version)} ${l.required_action==='RECOUNT'?`<button type="button" class="link" data-recount-sku="${escapeHTML(l.sku)}" data-recount-location="${escapeHTML(l.location)}">Recount this line →</button>`:l.required_action==='INVESTIGATE'?`<button type="button" class="link" data-sku="${escapeHTML(l.sku)}" data-location="${escapeHTML(l.location)}">Investigate →</button>`:''}</p>`).join('')}</div>`;let good=r.status==='COMPLETED'||r.status==='ALLOWED';let heading=r.status==='COMPLETED'?'DELIVERY COMPLETED':good?'PHYSICAL EVIDENCE VERIFIED':'DELIVERY HELD';let msg=({'STALE_PHYSICAL_EVIDENCE':'Inventory changed after the physical verification. Recount this SKU at its source bin.','MISSING_PHYSICAL_EVIDENCE':'No physical verification exists for this SKU and bin.','CONFLICTING_PHYSICAL_EVIDENCE':'Counters disagree at the same inventory version. Resolve explicitly before delivery.','DISCREPANCY':'Physical count differs from recorded stock. Investigate and adjust explicitly.','INSUFFICIENT_STOCK':'Requested quantity exceeds recorded stock.'})[r.reason]||r.reason;return `<div class="result ${good?'ok':''}" role="status"><h2>${heading}</h2><p>${escapeHTML(msg)}</p><dl>${[['SKU',r.sku],['Bin',r.location],['Requested',r.requested],['Recorded',r.recorded],['Evidence version',r.evidence_version===null?'none':'v'+r.evidence_version],['Current version','v'+r.current_version],['Remaining',r.remaining]].filter(x=>x[1]!==undefined).map(([k,v])=>`<div><dt>${k}</dt><dd>${escapeHTML(v)}</dd></div>`).join('')}</dl>${r.required_action==='RECOUNT'?'<button type="button" id="recount">Start recount →</button>':r.required_action==='INVESTIGATE'?`<button type="button" data-sku="${escapeHTML(r.sku)}" data-location="${escapeHTML(r.location)}">Investigate →</button>`:''}</div>`}
const deliveryStates=['DRAFT','READY','PICKING','PICKED','PACKING','PACKED','DONE'];
let editorStock=[];
function editorEvidence(stock){let counts=window.editorCounts||[],matching=counts.filter(e=>e.sku===stock.sku&&e.location===stock.warehouse+'/'+stock.location);if(!matching.length)return 'Not shown (latest 200 counts only)';let current=matching.filter(e=>e.captured_version===stock.version);if(!current.length)return 'Stale · recount required';if(new Set(current.map(e=>e.observed_qty)).size>1)return 'Conflicting counts · investigate';return current[0].observed_qty===stock.qty?'Latest shown count agrees (limited history)':'Count differs · investigate'}
function lineRow(first=false){let products=[...new Set(editorStock.map(r=>r.sku))], locations=[...new Set(editorStock.map(r=>r.warehouse+'/'+r.location))];let selectedSku=first?state.last?.sku:null,selectedLocation=first?state.last?.location:null;return `<div class="editor-line"><label>Product<select name="sku" required><option value="">Select product</option>${products.map(s=>`<option value="${escapeHTML(s)}" ${s===selectedSku?'selected':''}>${escapeHTML(s)} · ${escapeHTML(editorStock.find(r=>r.sku===s).name)}</option>`).join('')}</select></label><label>Source location<select name="location" required><option value="">Select location</option>${locations.map(s=>`<option value="${escapeHTML(s)}" ${s===selectedLocation?'selected':''}>${escapeHTML(s)}</option>`).join('')}</select></label>${field('Requested quantity','qty','number','','min="1" step="1"')}${first?'': '<button type="button" class="ghost" data-remove-line>Remove</button>'}<span class="line-feedback" aria-live="polite"></span></div>`}
function validateLines(form,report=true){let seen=new Set(),lines=[],valid=true;for(let row of form.querySelectorAll('.editor-line')){let sku=row.querySelector('[name="sku"]').value,location=row.querySelector('[name="location"]').value,raw=row.querySelector('[name="qty"]').value,stock=editorStock.find(r=>r.sku===sku&&r.warehouse+'/'+r.location===location),qty=Number(raw),key=sku+'|'+location;let error=!sku||!location?'Select product and source location':!stock?'No stock recorded for this product at this location':!raw||!Number.isSafeInteger(qty)||qty<=0?'Enter a positive whole-unit quantity':seen.has(key)?'Duplicate product / location':qty>stock.qty?'Only '+stock.qty+' available':'',hint=row.querySelector('.line-feedback');hint.textContent=error||(stock?`Available ${stock.qty} · v${stock.version} · Evidence: ${editorEvidence(stock)}. Final commit rechecks.`:'');hint.classList.toggle('ok',!error);valid=valid&&!error;seen.add(key);lines.push({sku,location,qty})}form.querySelector('button:not([type])').disabled=!valid;return valid?lines:null}
function deliveryEditor(){return form('delivery',field('Unique order reference','ref')+'<div id="editor-lines">'+lineRow(true)+'</div><button type="button" class="ghost" id="add-line">Add line +</button>'+field('Customer (optional)','contact','text','','data-optional="true"')+field('Destination (optional)','destination','text','','data-optional="true"'),'Create draft')}
function deliveryDetail(o,lastAttempts=[]){let idx=deliveryStates.indexOf(o.state),next={DRAFT:['READY','Mark ready'],READY:['START_PICKING','Start picking'],PICKING:['COMPLETE_PICKING','Complete picking'],PICKED:['START_PACKING','Start packing'],PACKING:['COMPLETE_PACKING','Complete packing']}[o.state];let incomplete=o.state==='PICKING'?o.lines.some(l=>l.picked_qty!==l.qty):o.state==='PACKING'?o.lines.some(l=>l.packed_qty!==l.qty):false;return panel('Delivery '+escapeHTML(o.ref),`<div class="progress" aria-label="Delivery status">${deliveryStates.map((s,i)=>`<span class="${i===idx?'current':i<idx?'past':''}">${s}</span>`).join('')}</div><p>Source warehouse: ${escapeHTML([...new Set(o.lines.map(l=>l.location.split('/')[0]))].join(', '))} · Destination: ${escapeHTML(o.destination||o.contact||'Not specified')} · Created ${escapeHTML(o.created_at)} · Updated ${escapeHTML(o.updated_at||o.created_at)}</p><div class="table-wrap"><table class="line-table"><thead><tr><th>Product</th><th>SKU</th><th>Source</th><th>Requested</th><th>Picked</th><th>Packed</th><th>Available</th><th>Evidence</th><th>Status</th></tr></thead><tbody>${o.lines.map(l=>`<tr class="${(l.evidence!=='CURRENT'||l.available_qty<l.qty)&&o.state==='PACKED'?'blocked-line':''}"><td>${escapeHTML(l.product)}</td><td>${escapeHTML(l.sku)}</td><td>${escapeHTML(l.location)}</td><td>${l.qty}</td><td>${l.picked_qty} · ${l.qty-l.picked_qty} left</td><td>${l.packed_qty} · ${l.qty-l.packed_qty} left</td><td>${l.available_qty} · v${l.inventory_version}</td><td><span class="pill ${l.evidence==='CURRENT'?'':'bad'}">${escapeHTML(l.evidence)}</span></td><td>${l.available_qty<l.qty?'Receive stock':l.evidence==='STALE'?'Recount '+escapeHTML(l.sku):l.evidence==='MISSING'?'Count '+escapeHTML(l.sku):l.evidence==='CONFLICT'?'Resolve conflicting counts':l.evidence==='DISCREPANCY'?'Investigate '+escapeHTML(l.sku):l.packed_qty===l.qty?'Ready':'In progress'}</td></tr>`).join('')}</tbody></table></div>${o.state==='PICKING'||o.state==='PACKING'?form('delivery-quantity',`<label>Line<select name="line_id">${o.lines.filter(l=>o.state==='PICKING'?l.picked_qty<l.qty:l.packed_qty<l.picked_qty).map(l=>`<option value="${l.id}">${escapeHTML(l.sku)} · ${escapeHTML(l.location)} · ${o.state==='PICKING'?l.qty-l.picked_qty:l.picked_qty-l.packed_qty} remaining</option>`).join('')}</select></label>`+field(o.state==='PICKING'?'Pick quantity':'Pack quantity','qty','number',1,'min="1" step="1"'),o.state==='PICKING'?'Record pick':'Record pack'):''}<div class="actions">${next?`<button type="button" data-step="${next[0]}" ${incomplete?'disabled title="Record the full quantity first"':''}>${next[1]}</button>`:''}${o.state==='PACKED'?'<button type="button" id="release">Attempt final delivery (evidence rechecked) →</button>':''}</div><p class="hint">${incomplete?'Record all required units before completing this step.':o.state==='PACKED'?'Final delivery requires current agreeing physical evidence and sufficient stock; picking does not reserve or decrement stock.':o.state==='DONE'?'Committed and audited; no further changes allowed.':'Pick and pack are persisted operations; stock changes only at final delivery.'}</p>${lastAttempts.length?`<div class="result"><strong>Latest recorded final attempt</strong><p>${escapeHTML(lastAttempts[0].created_at)} · ${escapeHTML(lastAttempts[0].actor_name)} · ${lastAttempts.some(a=>a.status==='BLOCKED')?'BLOCKED · no stock deducted':'ALLOWED'}</p>${lastAttempts.map(a=>`<p>${escapeHTML(a.sku)} / ${escapeHTML(a.location)}: ${escapeHTML(reasons[a.reason]||a.reason)} · evidence ${escapeHTML(a.evidence_version===null?'none':'v'+a.evidence_version)} / current v${escapeHTML(a.current_version)}</p>`).join('')}</div>`:''}<div id="decision"></div>`)}
function authView(){return `<section class="auth"><div class="eyebrow">Inventory with proof</div><h1>Veyra</h1><p class="muted">Sign in to your local inventory workspace.</p>${form('auth',field('Username','username')+field('Password','password','password'),'Sign in')}<p class="hint">New workspace? <button type="button" class="ghost" id="signup">Create account</button></p></section>`}
async function render(page=state.page){state.page=page;if(page!=='Investigation')location.hash=page==='Deliveries'&&state.selectedRef?'Deliveries/'+encodeURIComponent(state.selectedRef):encodeURIComponent(page);if(!state.token){$('#app').innerHTML=authView();return}$('#app').innerHTML=`<div class="shell"><aside><div><strong>VEYRA</strong><br><small>Evidence-led inventory</small></div><nav>${pages.map(p=>`<button type="button" data-page="${p}" class="${p===page?'active':''}">${p}</button>`).join('')}</nav><button type="button" class="ghost" id="logout">Log out · ${escapeHTML(state.user)}</button></aside><main><header><div><div class="eyebrow">Operations / ${escapeHTML(page)}</div><h1>${escapeHTML(page)}</h1></div><span class="pill">LOCAL · LIVE DATABASE</span></header><div id="content"><p>Loading…</p></div></main></div>`;let c=$('#content');try{let html='';
if(page==='Dashboard'){let d=await api('dashboard');html='<div class="banner">Final delivery checks recorded stock and current physical evidence for every line. A movement after a count requires a recount before commit.</div><div class="grid">'+Object.entries(d).map(([k,v])=>`<div class="card"><span class="eyebrow">${escapeHTML(k.replaceAll('_',' '))}</span><div class="metric">${escapeHTML(v)}</div></div>`).join('')+'</div>'+panel('Low stock / reorder',table((await api('inventory')).filter(r=>r.qty<=r.reorder_point),['sku','location','warehouse','qty','reorder_point']))}
if(page==='Inventory'){let list=await api('inventory');html=panel('Stock by location',`<input id="filter" placeholder="Search by SKU" aria-label="Search by SKU"><div id="stock-table">${stockTable(list)}</div>`);window.stockList=list}
if(page==='Products')html='<div class="two">'+panel('New product',form('product',field('SKU','sku')+field('Name','name')+field('Unit of measure','uom','text','unit')+field('Category (optional)','category','text','','data-optional="true"')+field('Reorder point','reorder_point','number',0,'min="0"'),'Create product'))+panel('New category',form('category',field('Name','name'),'Create category'))+'</div>'+panel('Update product',form('product-update',field('Existing SKU','sku')+field('New name','name'),'Update name'))+panel('Catalog',table(await api('products'),['sku','name','category','uom','reorder_point']));
if(page==='Warehouses')html='<div class="two">'+panel('New warehouse',form('warehouse',field('Code','code')+field('Name','name'),'Create warehouse'))+panel('New bin / location',form('location',field('Warehouse code','warehouse')+field('Bin code','code')+field('Name','name'),'Create location'))+'</div>'+panel('Warehouses',table(await api('warehouses'),['code','name']))+panel('Locations',table(await api('locations'),['warehouse','code','name']));
if(page==='Receipts')html=panel('Receive stock',form('receipt',field('Unique reference','ref')+field('Supplier','contact')+field('SKU','sku')+field('Location (WH/A)','location')+field('Quantity','qty','number',1,'min="1"'),'Validate receipt'))+panel('Recent receipts',table((await api('movements')).filter(m=>m.kind==='RECEIVE'),['ref','sku','destination','qty','contact','created_at']));
if(page==='Transfers')html=panel('Transfer stock between bins or warehouses',form('transfer',field('Unique reference','ref')+field('SKU','sku')+field('From (WH/A)','location')+field('To (OTHER/B)','destination')+field('Quantity','qty','number',1,'min="1"'),'Validate transfer'))+panel('Adjust recorded stock explicitly',form('adjust',field('Unique reference','ref')+field('SKU','sku')+field('Location','location')+field('New recorded quantity','qty','number',0,'min="0"'),'Validate adjustment'));
if(page==='Deliveries'){editorStock=await api('inventory');window.editorCounts=await api('evidence');let orders=await api('deliveries');let selected=orders.find(o=>o.ref===state.selectedRef);let attempts=selected?await api('decisions'):[];let latest=attempts.find(a=>a.ref===state.selectedRef&&a.stage==='COMMIT');let lastAttempts=latest?attempts.filter(a=>a.ref===state.selectedRef&&a.stage==='COMMIT'&&a.id<=latest.id&&a.id>latest.id-selected.lines.length):[];state.deliveryState=selected?.state;html=panel('Create delivery',`<p class="muted">Create a draft with one or more lines. Availability and evidence shown here are advisory (latest 200 counts); picking and packing do not reserve stock. Final commit checks all recorded counts and stock again.</p>${deliveryEditor()}`)+panel('Orders',orders.length?`<div class="table-wrap"><table><thead><tr><th>Open</th><th>Ref</th><th>SKU</th><th>Source</th><th>Requested</th><th>Picked</th><th>Packed</th><th>Status</th></tr></thead><tbody>${orders.map(o=>`<tr><td><button type="button" class="link" data-order="${escapeHTML(o.ref)}">Open →</button></td><td>${escapeHTML(o.ref)}</td><td>${escapeHTML(o.sku)}</td><td>${escapeHTML(o.location)}</td><td>${o.qty}</td><td>${o.picked_qty}</td><td>${o.packed_qty}</td><td><span class="pill">${escapeHTML(o.state)}</span></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No deliveries yet.</p>')+(selected?deliveryDetail(selected,lastAttempts):'');}
if(page==='Physical Verification'){state.count=await api('counts/open');html=panel('Begin physical count',`<p class="muted">Start captures the current inventory version. Do not start a new session after the count; movements during a count make the submitted evidence stale.</p>${form('count-start',field('SKU','sku','text',state.last?.sku||'')+field('Location (WH/A)','location','text',state.last?.location||''),'Start count')}<div id="count-form">${state.count?countForm():''}</div>`)+panel('Evidence history',evidenceTable(await api('evidence')))}
if(page==='Evidence Holds')html=panel('Delivery decisions',table(await api('decisions'),['ref','sku','location','stage','status','reason','evidence_version','current_version','stock_qty','created_at']));
if(page==='Investigation'){let params=state.caseId?'evidence_id='+encodeURIComponent(state.caseId):state.caseScope?'sku='+encodeURIComponent(state.caseScope.sku)+'&location='+encodeURIComponent(state.caseScope.location):null;if(params){let investigation=await api('investigations?'+params);state.caseScope={sku:investigation.sku,location:investigation.location};if(investigation.evidence)state.caseId=investigation.evidence.id;html=investigationView(investigation);let history=(await api('evidence')).filter(x=>x.sku===investigation.sku&&x.location===investigation.location);html+=panel('Counts at this location',`<p class="muted">Open an earlier count to review its snapshot, recorded movements and resolution. Latest 200 submitted counts are available.</p>${evidenceTable(history)}`)}else html=panel('Select a scope','<p class="muted">Open a stock row in Inventory or a submitted count in Physical Verification to investigate.</p>')}
if(page==='Audit')html=panel('Delivery lifecycle',table(await api('delivery-events'),['ref','action','from_state','to_state','qty_delta','sku','location','inventory_version','evidence_id','actor_name','created_at']))+panel('Delivery evidence decisions',table(await api('decisions'),['ref','stage','status','reason','evidence_id','current_version','actor','created_at']))+panel('Explicit discrepancy resolutions',table(await api('resolutions'),['evidence_id','sku','location','movement_ref','note','actor_name','created_at']))+panel('Movement ledger',table(await api('movements'),['ref','kind','sku','source','destination','qty','source_version','dest_version','actor_name','created_at']))+panel('Count evidence',table(await api('evidence'),['sku','location','observed_qty','captured_version','status','submitted_at']));
c.innerHTML=html;if(page==='Deliveries')validateLines($('#delivery'));}catch(e){c.innerHTML='<div class="result" role="alert">Unable to load '+escapeHTML(page)+': '+escapeHTML(e.message)+' <button type="button" class="ghost" data-page="'+escapeHTML(page)+'">Retry</button></div>'}}
function countForm(){return `<div class="result"><strong>Count started · v${escapeHTML(state.count.captured_version)}</strong><p>Recorded ${escapeHTML(state.count.recorded_qty)} at ${escapeHTML(state.count.location)}. Enter the observed physical quantity below.</p>${form('count-submit',field('Observed quantity','qty','number','','min="0"'),'Submit physical evidence')}</div>`}
function data(form){return Object.fromEntries(new FormData(form).entries())}
async function action(e){let form=e.type==='submit'?e.target:null;if(form){e.preventDefault();let d=data(form),id=form.id,r,submit=form.querySelector('button[type="submit"],button:not([type])');if(submit.disabled)return;submit.disabled=true;try{if(id==='auth'){r=await api('login',d);state.token=r.token;state.user=r.username;sessionStorage.setItem('veyra_token',r.token);sessionStorage.setItem('veyra_user',r.username);return render()}if(id==='delivery'){let lines=validateLines(form);if(!lines)throw Error('Correct the delivery lines first');d={ref:d.ref,contact:d.contact,destination:d.destination,lines};state.last=lines[0];r=await api('deliveries/preflight',d);state.selectedRef=d.ref;await render('Deliveries');notice('Delivery '+d.ref+' draft created. '+(r.status==='BLOCKED'?'A line needs attention before final commit.':'Pick and pack each line before final commit.'));return}if(id==='delivery-quantity'){r=await api('deliveries/step',{ref:state.selectedRef,action:state.deliveryState==='PACKING'?'PACK':'PICK',line_id:Number(d.line_id),qty:Number(d.qty)});await render('Deliveries');return}if(id==='count-start'){state.count=await api('counts/start',d);$('#count-form').innerHTML=countForm();return}if(id==='count-submit'){r=await api('counts/submit',{session_id:state.count.session_id,qty:Number(d.qty)});state.count=null;state.caseId=r.evidence_id;state.caseScope=null;location.hash='Investigation/e/'+r.evidence_id;return render('Investigation')}if(id==='resolve'){r=await api('investigations/resolve',{evidence_id:state.caseId,ref:d.ref,note:d.note});notice('Adjustment '+r.ref+' logged · recount required');return render('Investigation')}let routes={product:'products',category:'categories',warehouse:'warehouses',location:'locations','product-update':'products/update',receipt:'movements',transfer:'movements',adjust:'movements'};if(['receipt','transfer','adjust'].includes(id)){d.qty=Number(d.qty);d.kind={receipt:'RECEIVE',transfer:'TRANSFER',adjust:'ADJUST'}[id]}if(id==='product')d.reorder_point=Number(d.reorder_point);if(id==='product'&&!d.category)delete d.category;r=await api(routes[id],d);notice(r.status+' · '+(r.ref||id));render()}catch(err){notice(err.message)}finally{if(submit.isConnected)submit.disabled=false}return}
let b=e.target.closest('button');if(!b)return;if(b.dataset.recountSku){state.last={sku:b.dataset.recountSku,location:b.dataset.recountLocation};render('Physical Verification');return}if(b.dataset.order){state.selectedRef=b.dataset.order;render('Deliveries');return}if(b.id==='add-line'){let holder=$('#editor-lines');holder.insertAdjacentHTML('beforeend',lineRow());validateLines($('#delivery'));return}if(b.hasAttribute('data-remove-line')){b.closest('.editor-line').remove();validateLines($('#delivery'));return}if(b.dataset.step){try{await api('deliveries/step',{ref:state.selectedRef,action:b.dataset.step});await render('Deliveries')}catch(err){notice(err.message)}return}if(b.dataset.evidence){state.caseId=Number(b.dataset.evidence);state.caseScope=null;location.hash='Investigation/e/'+state.caseId;render('Investigation');return}if(b.dataset.sku){state.caseId=null;state.caseScope={sku:b.dataset.sku,location:b.dataset.location};location.hash='Investigation/s/'+encodeURIComponent(b.dataset.sku)+'/'+encodeURIComponent(b.dataset.location);render('Investigation');return}if(b.dataset.page){if(b.dataset.page==='Investigation'){state.caseId=null;state.caseScope=null;location.hash='Investigation'}render(b.dataset.page);return}if(b.id==='signup'){let d=data($('#auth'));try{let r=await api('signup',d);state.token=r.token;state.user=r.username;sessionStorage.setItem('veyra_token',r.token);sessionStorage.setItem('veyra_user',r.username);render()}catch(err){notice(err.message)}}if(b.id==='logout'){try{await api('logout',{})}catch{}sessionStorage.clear();state.token=null;render()}if(b.id==='recount'||b.id==='investigate-recount'){if(b.id==='investigate-recount'&&state.caseScope)state.last={...state.last,sku:state.caseScope.sku,location:state.caseScope.location};render('Physical Verification')}if(b.id==='release'){try{let o=(await api('deliveries')).find(o=>o.ref===state.selectedRef);let r=await api('deliveries/commit',{ref:o.ref});await render('Deliveries');$('#decision').innerHTML=decision(r);if(r.status==='COMPLETED')notice('Delivery '+r.ref+' committed. '+(r.lines?.length||1)+' stock movement(s) recorded.')}catch(err){notice(err.message)}}}
document.addEventListener('submit',action);document.addEventListener('click',action);document.addEventListener('input',e=>{if(e.target.closest('#delivery .editor-line'))validateLines($('#delivery'));if(e.target.id==='filter')$('#stock-table').innerHTML=stockTable(window.stockList.filter(r=>r.sku.toLowerCase().includes(e.target.value.toLowerCase())))});document.addEventListener('change',e=>{if(e.target.closest('#delivery .editor-line'))validateLines($('#delivery'))});function restoreRoute(){let h=location.hash.slice(1);try{if(h.startsWith('Deliveries/')){state.selectedRef=decodeURIComponent(h.slice(11));return 'Deliveries'}if(h.startsWith('Investigation/e/')){let id=Number(h.slice(16));if(Number.isSafeInteger(id)&&id>0){state.caseId=id;return 'Investigation'}}if(h.startsWith('Investigation/s/')){let parts=h.slice(16).split('/');if(parts.length===2){state.caseScope={sku:decodeURIComponent(parts[0]),location:decodeURIComponent(parts[1])};return 'Investigation'}}let page=decodeURIComponent(h);return pages.includes(page)?page:'Dashboard'}catch{return 'Dashboard'}}window.addEventListener('hashchange',()=>{let page=restoreRoute();if(page!==state.page||page==='Deliveries'||page==='Investigation')render(page)});render(restoreRoute());
</script></body></html>
